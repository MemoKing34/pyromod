[project]
name = "pyromod"
version = "3.2.0"
description = "A monkeypatcher add-on for Pyrogram that does conversation handling"
authors = [{ name = "Pauxis", email = "pauxiscezar@gmail.com" }]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "kurigram>=2.2.22",
]

[tool.hatch.metadata]
allow-direct-references = true
